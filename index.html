<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Übungs-Abnahme FLŌ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout concept: sticky progress header incl. language switcher, then exercise
   cards grouped by Kraft/HIIT/Yoga, each pairing a looping mannequin animation
   (ported 1:1 from the app's own forward-kinematics engine) with localized
   copy (DE/EN/AR) and a three-way sign-off control, closing with an explicit
   confirmation step. No account, no app, no internet needed after first
   load: every answer lives only in this browser (localStorage) and is turned
   into a text report the trainer copies and sends back manually. This file
   is meant to be opened directly (double-tap on a phone, or any browser) —
   it is not hosted anywhere. */
:root{
  color-scheme: dark;
  --bg:#07071A; --surface:#11112A; --surface-2:#171a3d; --border:rgba(255,255,255,.1);
  --fg:#F4F5FA; --fg-dim:rgba(244,245,250,.64); --accent:#34D7A8; --accent-ink:#06231b;
  --warn:#F5A524; --warn-ink:#3a2500; --danger:#F2545B; --danger-ink:#3a0a0e;
  --figure:#CBD5E1; --figure-far:#7C8BA1; --muscle:#FB923C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Cairo,system-ui,sans-serif;padding:0 16px;padding-bottom:60px;padding-top:20px}
h1,.num{font-family:Outfit,system-ui,sans-serif}
[dir="rtl"] h1,[dir="rtl"] .num{font-family:Cairo,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto}
header.top{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.2px}
.sub{color:var(--fg-dim);font-size:13.5px;margin:2px 0 0}
.langsw{display:flex;gap:4px;background:var(--surface-2);border-radius:99px;padding:3px;flex:0 0 auto}
.langsw button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;border:none;background:transparent;color:var(--fg-dim);cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.info{padding:14px 16px;font-size:13.5px;color:var(--fg-dim);line-height:1.55}
.info b{color:var(--fg);font-weight:700}
.progress-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress-num{font-weight:700;font-size:13.5px;white-space:nowrap}
.name-row{display:flex;gap:10px;align-items:center;padding:0 16px 14px;flex-wrap:wrap}
.name-row label{font-size:13px;color:var(--fg-dim);white-space:nowrap}
input.name{flex:1;min-width:160px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;font-size:14px}
input.name:focus{outline:2px solid var(--accent);outline-offset:1px}
.export-row{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.export-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.export-btn{font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;border:none;background:var(--surface-2);color:var(--fg);cursor:pointer}
.export-hint{font-size:12px;color:var(--fg-dim)}
textarea.report{width:100%;min-height:110px;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--fg);font:12px/1.5 ui-monospace,Consolas,monospace;direction:ltr}
.no-account{padding:14px 16px;font-size:12.5px;color:var(--fg-dim);border-top:1px solid var(--border)}
.group-title{font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg-dim);margin:30px 0 12px;padding-left:2px}
[dir="rtl"] .group-title{letter-spacing:0;padding-left:0;padding-right:2px}
.group-title:first-of-type{margin-top:8px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.ex-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.ex-title-wrap{min-width:0;flex:1}
.ex-name{font-size:16px;font-weight:700;margin:0 0 2px}
.ex-id{font-size:11px;color:var(--fg-dim);font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:plaintext}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg-dim);white-space:nowrap}
.tag.diff{color:var(--fg)}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--fg-dim)}
.status-pill[data-s="approved"]{background:var(--accent);color:var(--accent-ink)}
.status-pill[data-s="changes"]{background:var(--warn);color:var(--warn-ink)}
.status-pill[data-s="remove"]{background:var(--danger);color:var(--danger-ink)}
.body-row{display:flex;gap:16px;flex-wrap:wrap}
.figure-box{flex:0 0 auto;width:150px;background:var(--surface-2);border-radius:12px;overflow:hidden}
.figure-box svg{display:block;width:100%;height:auto}
.steps{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.steps ol{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.steps ol li::marker{color:var(--fg-dim);font-weight:700}
.safety{font-size:12.5px;color:var(--fg-dim);background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;gap:7px}
.safety b{color:var(--fg);flex:0 0 auto}
.review{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;font:inherit;font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-dim);cursor:pointer}
.seg button[aria-pressed="true"][data-s="approved"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button[aria-pressed="true"][data-s="changes"]{background:var(--warn);color:var(--warn-ink);border-color:var(--warn)}
.seg button[aria-pressed="true"][data-s="remove"]{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
textarea.notes{width:100%;resize:vertical;min-height:46px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--fg);font:inherit;font-size:13px}
textarea.notes:focus{outline:2px solid var(--accent);outline-offset:1px}
.confirm-card{margin-top:28px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;border-color:var(--accent)}
.confirm-title{font-size:15px;font-weight:700;margin:0}
.confirm-check{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--fg-dim);cursor:pointer}
.confirm-check input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}
.confirm-btn{font:inherit;font-weight:700;font-size:14px;padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;align-self:flex-start}
.confirm-btn:disabled{opacity:.35;cursor:not-allowed}
.confirm-status{font-size:12.5px;color:var(--accent);font-weight:700;margin:0}
.anim-toggle{position:sticky;bottom:16px;display:flex;justify-content:flex-end}
[dir="rtl"] .anim-toggle{justify-content:flex-start}
.anim-btn{font:inherit;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:520px){
  .figure-box{width:128px}
  .ex-head{flex-direction:column}
  .status-pill{align-self:flex-start}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div>
        <h1 id="pageTitle">Übungs-Abnahme FLŌ</h1>
        <p class="sub" id="pageSub">26 Bewegungen · Mannequin-Animation + Anleitungstext zur fachlichen Prüfung</p>
      </div>
      <div class="langsw" id="langsw" role="group" aria-label="Sprache">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ar">AR</button>
      </div>
    </div>
    <div class="card info" id="infoBox"></div>
    <div class="card">
      <div class="progress-row">
        <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
        <div class="progress-num"><span id="progNum">0</span><span id="progSuffix"> / 26 geprüft</span></div>
      </div>
      <div class="name-row">
        <label for="reviewerName" id="nameLabel">Name des Trainers</label>
        <input class="name" id="reviewerName" type="text" autocomplete="off">
      </div>
      <div class="export-row">
        <div class="export-top">
          <button type="button" class="export-btn" id="exportBtn">Bericht kopieren</button>
          <span class="export-hint" id="exportHint"></span>
        </div>
        <textarea class="report" id="reportBox" readonly></textarea>
      </div>
      <div class="no-account" id="noAccountNote"></div>
    </div>
  </header>

  <div id="groups"></div>

  <div class="card confirm-card" id="confirmCard">
    <p class="confirm-title" id="confirmTitle"></p>
    <label class="confirm-check">
      <input type="checkbox" id="confirmCheck">
      <span id="confirmLabel"></span>
    </label>
    <button type="button" class="confirm-btn" id="confirmBtn" disabled></button>
    <p class="confirm-status" id="confirmStatus"></p>
  </div>
</div>

<div class="anim-toggle"><button class="anim-btn" id="animToggle" type="button">Animation pausieren</button></div>

, then switch sides."],"ar":["قف والساقان متباعدتان. أدر إحدى القدمين للخارج وثنِ هذه الركبة فوق الكاحل وأبقِ الساق الأخرى مستقيمة.","ارفع الذراعين جانباً حتى مستوى الكتفين وراحتاك للأسفل. يبقى الجذع مستقيماً فوق الحوض.","ابقَ بضعة أنفاس هادئة ثم بدّل الجانب."]},"safety":{"de":"Das Knie zeigt in Richtung des Fußes, nie nach innen. Bei Knieschmerzen weniger tief beugen.","en":"The knee points in the direction of the foot, never inward. Bend less deeply with knee pain.","ar":"تتجه الركبة نحو اتجاه القدم وليس للداخل. اثنِ أقل عند ألم الركبة."},"difficulty":"beginner","bodyAreas":["legs","hips","shoulders"]},{"id":"tree-pose","category":"yoga","view":"front","contact":["feet"],"cycleMs":8000,"keyframes":[{"t":0,"pose":{"torso":0,"armL":[5,0],"armR":[5,0],"legL":[3,0],"legR":[3,0]}},{"t":0.35,"pose":{"torso":0,"armL":[15,130],"armR":[15,130],"legL":[30,114],"legR":[2,0]}},{"t":0.7,"pose":{"torso":0,"armL":[15,130],"armR":[15,130],"legL":[30,114],"legR":[2,0]}},{"t":1,"pose":{"torso":0,"armL":[5,0],"armR":[5,0],"legL":[3,0],"legR":[3,0]}}],"muscles":["glutes","quads","abs"],"equipment":null,"sets":1,"reps":null,"holdSeconds":30,"name":{"de":"Baumhaltung","en":"Tree pose","ar":"وضعية الشجرة"},"steps":{"de":["Stell dich auf ein Bein und suche dir einen festen Punkt vor dir.","Setze die Fußsohle des anderen Beins an die Innenseite des Standbeins, unterhalb oder oberhalb des Knies, nie direkt auf das Knie.","Bringe die Handflächen vor der Brust zusammen. Halte ruhig und wechsle die Seite."],"en":["Stand on one leg and find a fixed point in front of you.","Place the sole of the other foot on the inside of the standing leg, below or above the knee, never directly on the knee.","Bring the palms together in front of the chest. Hold calmly and switch sides."],"ar":["قف على ساق واحدة وابحث عن نقطة ثابتة أمامك.","ضع باطن القدم الأخرى على الجهة الداخلية للساق الثابتة أسفل الركبة أو أعلاها وليس على الركبة مباشرة.","ضمّ راحتيك أمام الصدر. اثبت بهدوء ثم بدّل الجانب."]},"safety":{"de":"S   var shoulder = sides.map(function(s){ return padd(shoulderCenter, across, s*BODY.shoulderHalf) });
  var hip = sides.map(function(s){ return padd(pelvis, {x:1,y:0}, s*BODY.hipHalf) });

  function limb(root, pair, side, kind){
    var upper = pair[0], flex = pair[1];
    var mirror = view==="front" ? (side===0?1:side) : 1;
    var first = padd(root, fromDown(upper*mirror), kind==="arm"?BODY.upperArm:BODY.thigh);
    var second = padd(first, fromDown(lowerAngle(view,kind,upper,flex)*mirror), kind==="arm"?BODY.forearm:BODY.shin);
    return [first, second];
  }

  var arms = [pose.armL, pose.armR], legs = [pose.legL, pose.legR];
  var elbow=[], hand=[], knee=[], ankle=[], toe=[];
  for(var i=0;i<2;i++){
    var side = sides[i];
    var ea = limb(shoulder[i], arms[i], side, "arm");
    var la = limb(hip[i], legs[i], side, "leg");
    elbow.push(ea[0]); hand.push(ea[1]); knee.push(la[0]); ankle.push(la[1]);
    var footAngle = (i===0 ? pose.footL : pose.footR); if(footAngle===undefined) footAngle = pose.foot!==undefined?pose.foot:90;
    var mirror = view==="front" ? (side===0?1:side) : 1;
    toe.push(padd(ankle[i], fromDown(footAngle*mirror), BODY.foot));
  }
  return { pelvis:pelvis, shoulderCenter:shoulderCenter, head:head, shoulder:shoulder, elbow:elbow, hand:hand, hip:hip, knee:knee, ankle:ankle, toe:toe };
}

function contactPoints(joints, contact){
  var pts = [];
  if(contact.indexOf("feet")>=0) pts = pts.concat(joints.ankle, joints.toe);
  if(contact.indexOf("hands")>=0) pts = pts.concat(joints.hand);
  if(contact.indexOf("knees")>=0) pts = pts.concat(joints.knee);
  if(contact.indexOf("hips")>=0) pts.push({x:joints.pelvis.x, y:joints.pelvis.y+9});
  if(contact.indexOf("shoulders")>=0) pts.push({x:joints.shoulderCenter.x, y:joints.shoulderCenter.y+9});
  return pts;
}

function solve(pose, view, contact){
  var raw = rawJoints(pose, view);
  var lowest = Math.max.apply(null, contactPoints(raw, contact).map(function(p){return p.y}));
  var dy = CANVAS.floorY - lowest - (pose.lift||0);
  var dx = CANVAS.centerX;
  function mv(p){ return { x:p.x+dx, y:p.y+dy } }
  function pair(p){ return [mv(p[0]), mv(p[1])] }
  return {
    pelvis:mv(raw.pelvis), shoulderCenter:mv(raw.shoulderCenter), head:mv(raw.head),
    shoulder:pair(raw.shoulder), elbow:pair(raw.elbow), hand:pair(raw.hand),
    hip:pair(raw.hip), knee:pair(raw.knee), ankle:pair(raw.ankle), toe:pair(raw.toe),
  };
}

function smooth(u){ return u*u*(3-2*u) }
function mix(a,b,u){ return a+(b-a)*u }
function mixLimb(a,b,u){ return [mix(a[0],b[0],u), mix(a[1],b[1],u)] }

function blend(a,b,u){
  return {
    torso: mix(a.torso,b.torso,u),
    head: mix(a.head||0, b.head||0, u),
    x: mix(a.x||0, b.x||0, u),
    lift: mix(a.lift||0, b.lift||0, u),
    foot: mix(a.foot!==undefined?a.foot:90, b.foot!==undefined?b.foot:90, u),
    footL: mix(a.footL!==undefined?a.footL:(a.foot!==undefined?a.foot:90), b.footL!==undefined?b.footL:(b.foot!==undefined?b.foot:90), u),
    footR: mix(a.footR!==undefined?a.footR:(a.foot!==undefined?a.foot:90), b.footR!==undefined?b.footR:(b.foot!==undefined?b.foot:90), u),
    armL: mixLimb(a.armL,b.armL,u), armR: mixLimb(a.armR,b.armR,u),
    legL: mixLimb(a.legL,b.legL,u), legR: mixLimb(a.legR,b.legR,u),
  };
}

function poseAt(keyframes, t){
  var clamped = Math.min(Math.max(t,0),1);
  for(var i=1;i<keyframes.length;i++){
    var prev = keyframes[i-1], next = keyframes[i];
    if(clamped <= next.t){
      var span = next.t - prev.t;
      return blend(prev.pose, next.pose, span<=0?1:smooth((clamped-prev.t)/span));
    }
  }
  return keyframes[keyframes.length-1].pose;
}

// ---------------------------------------------------------------- figure rendering (ported from ExerciseFigure.tsx)
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function lerpPt(a,b,u){ return { x:a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u } }
function lineEl(seg, color, from, to, width, opacity){
  from = from===undefined?0:from; to = to===undefined?1:to; width = width===undefined?seg.width:width; opacity = opacity===undefined?1:opacity;
  var a = lerpPt(seg.a, seg.b, from), b = lerpPt(seg.a, seg.b, to);
  return el("line", { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:color, "stroke-width":width, "stroke-linecap":"round", opacity:opacity });
}
function highlights(j, muscles, frontView, near){
  var torso = { a:j.pelvis, b:j.shoulderCenter, width: frontView?30:24 };
  function upperArm(i){ return { a:j.shoulder[i], b:j.elbow[i], width:9 } }
  function forearm(i){ return { a:j.elbow[i], b:j.hand[i], width:8 } }
  function thigh(i){ return { a:j.hip[i], b:j.knee[i], width:13 } }
  function shin(i){ return { a:j.knee[i], b:j.ankle[i], width:10 } }
  var out = [];
  function on(seg, from, to){ out.push(lineEl(seg, "var(--muscle)", from, to, seg.width*0.78, 0.95)) }
  for(var mi=0; mi<muscles.length; mi++){
    var m = muscles[mi];
    for(var ni=0; ni<near.length; ni++){
      var i = near[ni];
      if(m==="biceps"||m==="triceps") on(upperArm(i), 0.14, 0.86);
      if(m==="forearms") on(forearm(i), 0.12, 0.88);
      if(m==="quads"||m==="hamstrings") on(thigh(i), 0.12, 0.88);
      if(m==="calves") on(shin(i), 0.15, 0.85);
      if(m==="shoulders") out.push(el("circle",{cx:j.shoulder[i].x, cy:j.shoulder[i].y, r:9, fill:"var(--muscle)", opacity:0.95}));
    }
    if(m==="chest"||m==="upperBack") on(torso, 0.5, 0.92);
    if(m==="abs"||m==="obliques"||m==="lowerBack") on(torso, 0.08, 0.5);
    if(m==="glutes"||m==="hipFlexors") out.push(el("circle",{cx:j.pelvis.x, cy:j.pelvis.y, r:frontView?10:12, fill:"var(--muscle)", opacity:0.95}));
  }
  return out;
}
function dumbbellEls(hand, forearmFrom){
  var dx = hand.x-forearmFrom.x, dy = hand.y-forearmFrom.y;
  var len = Math.hypot(dx,dy) || 1;
  var nx = -dy/len, ny = dx/len, bar = 9;
  var a = { x:hand.x+nx*bar, y:hand.y+ny*bar }, b = { x:hand.x-nx*bar, y:hand.y-ny*bar };
  var out = [];
  out.push(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#94A3B8","stroke-width":3,"stroke-linecap":"round"}));
  out.push(el("line",{x1:a.x+nx*1,y1:a.y+ny*1,x2:a.x-nx*5,y2:a.y-ny*5,stroke:"#64748B","stroke-width":9,"stroke-linecap":"round"}));
  out.push(el("line",{x1:b.x-nx*1,y1:b.y-ny*1,x2:b.x+nx*5,y2:b.y+ny*5,stroke:"#64748B","stroke-width":9,"stroke-linecap":"round"}));
  return out;
}
function buildFigure(svg, move, pose){
  var j = solve(pose, move.view, move.contact);
  var front = move.view === "front";
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute("viewBox", "0 0 " + CANVAS.width + " " + CANVAS.height);

  function armEls(i, color){
    var g = el("g", {});
    g.appendChild(lineEl({a:j.shoulder[i], b:j.elbow[i], width:9}, color));
    g.appendChild(lineEl({a:j.elbow[i], b:j.hand[i], width:8}, color));
    g.appendChild(el("circle",{cx:j.hand[i].x, cy:j.hand[i].y, r:BODY.hand, fill:color}));
    return g;
  }
  function legEls(i, color){
    var g = el("g", {});
    g.appendChild(lineEl({a:j.hip[i], b:j.knee[i], width:13}, color));
    g.appendChild(lineEl({a:j.knee[i], b:j.ankle[i], width:10}, color));
    g.appendChild(lineEl({a:j.ankle[i], b:j.toe[i], width:6}, color));
    return g;
  }
  var farColor = front ? "var(--figure)" : "var(--figure-far)";
  var near = front ? [0,1] : [0];

  svg.appendChild(lineEl({a:{x:20,y:CANVAS.floorY+4}, b:{x:CANVAS.width-20,y:CANVAS.floorY+4}, width:3}, "var(--border)"));
  svg.appendChild(armEls(1, farColor));
  svg.appendChild(legEls(1, farColor));
  svg.appendChild(lineEl({a:j.pelvis, b:j.shoulderCenter, width: front?30:24}, "var(--figure)"));
  svg.appendChild(el("circle",{cx:j.head.x, cy:j.head.y, r:BODY.headR, fill:"var(--figure)"}));
  svg.appendChild(legEls(0, "var(--figure)"));
  svg.appendChild(armEls(0, "var(--figure)"));
  highlights(j, move.muscles, front, near).forEach(function(n){ svg.appendChild(n) });
  if(move.equipment==="dumbbell"){ near.forEach(function(i){ dumbbellEls(j.hand[i], j.elbow[i]).forEach(function(n){svg.appendChild(n)}) }) }
}

// ---------------------------------------------------------------- local-only state (no account, no app, no hosting)
var STORE_KEY = "flo-trainer-review-v3";
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var playing = !reduceMotion;
var startTimes = {};
var svgRefs = {};
var reviewerName = "";
var items = {}; // id -> { status, notes }
var confirmed = false;
var confirmedAt = null;

function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(parsed && typeof parsed === "object"){
      reviewerName = parsed.reviewerName || "";
      items = parsed.items || {};
      confirmed = !!parsed.confirmed;
      confirmedAt = parsed.confirmedAt || null;
      if(parsed.lang && I18N[parsed.lang]) currentLang = parsed.lang;
    }
  }catch(e){}
}
var saveTimer = null;
function saveStore(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify({ reviewerName:reviewerName, items:items, lang:currentLang, confirmed:confirmed, confirmedAt:confirmedAt })) }catch(e){}
  }, 250);
}

function reviewedCount(){
  var n = 0;
  for(var id in items){ if(items[id] && items[id].status) n++ }
  return n;
}

function invalidateConfirm(){
  if(confirmed){ confirmed = false; confirmedAt = null; saveStore(); updateConfirmUI() }
}

function buildCard(ex){
  var L = t();
  var card = document.createElement("div");
  card.className = "card ex-card";
  card.id = "card-" + ex.id;

  var head = document.createElement("div");
  head.className = "ex-head";
  var titleWrap = document.createElement("div");
  titleWrap.className = "ex-title-wrap";
  var h = document.createElement("p"); h.className = "ex-name"; h.textContent = ex.name[currentLang];
  var idp = document.createElement("div"); idp.className = "ex-id"; idp.textContent = ex.id;
  var tags = document.createElement("div"); tags.className = "tags";
  var t1 = document.createElement("span"); t1.className = "tag diff"; t1.textContent = L.diff[ex.difficulty] || ex.difficulty;
  var t2 = document.createElement("span"); t2.className = "tag"; t2.textContent = L.dose(ex);
  tags.appendChild(t1); tags.appendChild(t2);
  ex.bodyAreas.slice(0,3).forEach(function(a){ var tg=document.createElement("span"); tg.className="tag"; tg.textContent=a; tags.appendChild(tg) });
  if(ex.equipment==="dumbbell"){ var te=document.createElement("span"); te.className="tag"; te.textContent=L.equipment; tags.appendChild(te) }
  titleWrap.appendChild(h); titleWrap.appendChild(idp); titleWrap.appendChild(tags);
  var cur = items[ex.id] || {};
  var pill = document.createElement("span"); pill.className = "status-pill"; pill.id = "pill-" + ex.id;
  pill.textContent = cur.status ? L.status[cur.status] : L.notReviewed;
  if(cur.status) pill.setAttribute("data-s", cur.status);
  head.appendChild(titleWrap); head.appendChild(pill);

  var body = document.createElement("div");
  body.className = "body-row";
  var figBox = document.createElement("div"); figBox.className = "figure-box";
  var svg = el("svg", {});
  figBox.appendChild(svg);
  svgRefs[ex.id] = { svg: svg, move: ex };

  var steps = document.createElement("div"); steps.className = "steps";
  var ol = document.createElement("ol");
  ex.steps[currentLang].forEach(function(s){ var li=document.createElement("li"); li.textContent=s; ol.appendChild(li) });
  var safety = document.createElement("div"); safety.className = "safety";
  var sb = document.createElement("b"); sb.textContent = L.safetyLabel;
  var sspan = document.createElement("span"); sspan.textContent = ex.safety[currentLang];
  safety.appendChild(sb); safety.appendChild(sspan);
  steps.appendChild(ol); steps.appendChild(safety);

  body.appendChild(figBox); body.appendChild(steps);

  var review = document.createElement("div");
  review.className = "review";
  var seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("role","radiogroup");
  ["approved","changes","remove"].forEach(function(s){
    var b = document.createElement("button");
    b.type = "button"; b.dataset.s = s; b.setAttribute("role","radio");
    b.setAttribute("aria-pressed", String(cur.status===s));
    b.textContent = (s==="approved"?"✓ ":s==="changes"?"✎ ":"✕ ") + L.status[s];
    b.addEventListener("click", function(){ setStatus(ex.id, s) });
    seg.appendChild(b);
  });
  var notes = document.createElement("textarea");
  notes.className = "notes"; notes.id = "notes-" + ex.id;
  notes.placeholder = L.notesPlaceholder;
  notes.value = cur.notes || "";
  notes.addEventListener("input", function(){
    var it = items[ex.id] || {}; it.notes = notes.value; items[ex.id] = it;
    saveStore(); invalidateConfirm(); renderReport();
  });
  review.appendChild(seg); review.appendChild(notes);

  card.appendChild(head); card.appendChild(body); card.appendChild(review);
  return card;
}

function setStatus(id, status){
  var it = items[id] || {};
  it.status = it.status === status ? undefined : status; // click again to clear
  items[id] = it;
  var card = document.getElementById("card-" + id);
  card.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.s===it.status)) });
  var pill = document.getElementById("pill-" + id);
  var L = t();
  if(it.status){ pill.textContent = L.status[it.status]; pill.setAttribute("data-s", it.status) }
  else { pill.textContent = L.notReviewed; pill.removeAttribute("data-s") }
  saveStore();
  invalidateConfirm();
  updateProgress();
  renderReport();
}

function updateProgress(){
  var n = reviewedCount();
  document.getElementById("progNum").textContent = String(n);
  document.getElementById("barFill").style.width = Math.round((n/26)*100) + "%";
}

function renderGroups(){
  var L = t();
  var container = document.getElementById("groups");
  container.innerHTML = "";
  svgRefs = {};
  GROUP_ORDER.forEach(function(g){
    var exList = EXERCISES.filter(function(e){ return e.category===g });
    if(!exList.length) return;
    var title = document.createElement("div"); title.className = "group-title"; title.textContent = L.groups[g] + " · " + exList.length;
    container.appendChild(title);
    var grid = document.createElement("div"); grid.className = "grid";
    exList.forEach(function(ex){ grid.appendChild(buildCard(ex)) });
    container.appendChild(grid);
  });
  for(var id2 in svgRefs) svgRefs[id2].drawnStatic = false;
}

function buildReportText(){
  var L = t();
  var lines = [];
  lines.push(L.reportTitle);
  lines.push(L.reportTrainer + ": " + (reviewerName.trim() || L.reportNoName));
  lines.push(L.reportDate + ": " + new Date().toLocaleString(L.locale));
  lines.push("");
  GROUP_ORDER.forEach(function(g){
    var exList = EXERCISES.filter(function(e){ return e.category===g });
    if(!exList.length) return;
    lines.push("== " + L.groups[g] + " ==");
    exList.forEach(function(ex){
      var it = items[ex.id] || {};
      var statusLabel = it.status ? L.status[it.status] : L.notReviewed;
      lines.push("- " + ex.name[currentLang] + " (" + ex.id + "): " + statusLabel);
      if(it.notes && it.notes.trim()) lines.push("  " + L.reportNotes + ": " + it.notes.trim());
    });
    lines.push("");
  });
  if(confirmed){
    lines.push(L.reportConfirmed(reviewerName.trim() || L.reportNoName, new Date(confirmedAt).toLocaleString(L.locale)));
  } else {
    lines.push(L.reportNotConfirmed);
  }
  return lines.join("\n");
}

function renderReport(){
  document.getElementById("reportBox").value = buildReportText();
}

function doExport(){
  var L = t();
  var text = buildReportText();
  var hint = document.getElementById("exportHint");
  var box = document.getElementById("reportBox");
  box.value = text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      hint.textContent = L.exportCopied;
    }).catch(function(){
      hint.textContent = L.exportCopyFailed;
      box.focus(); box.select();
    });
  } else {
    hint.textContent = L.exportCopyFailed;
    box.focus(); box.select();
  }
}

function updateConfirmUI(){
  var L = t();
  var chk = document.getElementById("confirmCheck");
  var btn = document.getElementById("confirmBtn");
  var status = document.getElementById("confirmStatus");
  chk.checked = confirmed;
  chk.disabled = confirmed;
  btn.disabled = confirmed || !chk.checked || !reviewerName.trim();
  status.textContent = confirmed
    ? (L.confirmedPrefix + " " + (reviewerName.trim() || L.reportNoName) + " " + L.confirmedOn + " " + new Date(confirmedAt).toLocaleString(L.locale))
    : "";
}

function applyStaticTexts(){
  var L = t();
  document.getElementById("pageTitle").textContent = L.title;
  document.getElementById("pageSub").textContent = L.sub;
  document.getElementById("infoBox").innerHTML = L.info;
  document.getElementById("progSuffix").textContent = L.progressSuffix;
  document.getElementById("nameLabel").textContent = L.nameLabel;
  document.getElementById("reviewerName").placeholder = L.namePlaceholder;
  document.getElementById("animToggle").textContent = playing ? L.animPause : L.animPlay;
  document.getElementById("exportBtn").textContent = L.exportBtn;
  document.getElementById("exportHint").textContent = "";
  document.getElementById("noAccountNote").textContent = L.noAccount;
  document.getElementById("confirmTitle").textContent = L.confirmTitle;
  document.getElementById("confirmLabel").textContent = L.confirmLabel;
  document.getElementById("confirmBtn").textContent = L.confirmBtn;
}

function setLang(lang){
  currentLang = lang;
  saveStore();
  document.documentElement.setAttribute("dir", I18N[lang].dir);
  document.documentElement.setAttribute("lang", lang);
  document.querySelectorAll("#langsw button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang===lang)) });
  applyStaticTexts();
  renderGroups();
  updateProgress();
  renderReport();
  updateConfirmUI();
}

// ---------------------------------------------------------------- animation loop
var lastFrame = 0;
function tick(now){
  if(playing && now - lastFrame > 40){
    lastFrame = now;
    for(var id in svgRefs){
      var ref = svgRefs[id];
      if(startTimes[id]===undefined) startTimes[id] = now;
      var frac = ((now - startTimes[id]) % ref.move.cycleMs) / ref.move.cycleMs;
      buildFigure(ref.svg, ref.move, poseAt(ref.move.keyframes, frac));
    }
  } else if(!playing){
    for(var id2 in svgRefs){
      var r2 = svgRefs[id2];
      if(!r2.drawnStatic){ buildFigure(r2.svg, r2.move, poseAt(r2.move.keyframes, 0.5)); r2.drawnStatic = true }
    }
  }
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- boot
function start(){
  loadStore();
  document.querySelectorAll("#langsw button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.dataset.lang) });
  });
  document.documentElement.setAttribute("dir", I18N[currentLang].dir);
  document.documentElement.setAttribute("lang", currentLang);
  document.querySelectorAll("#langsw button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang===currentLang)) });

  var nameEl = document.getElementById("reviewerName");
  nameEl.value = reviewerName;
  nameEl.addEventListener("input", function(){
    reviewerName = nameEl.value; saveStore(); invalidateConfirm(); renderReport(); updateConfirmUI();
  });

  document.getElementById("animToggle").addEventListener("click", function(){
    playing = !playing;
    document.getElementById("animToggle").textContent = playing ? t().animPause : t().animPlay;
    if(playing) for(var k in svgRefs) svgRefs[k].drawnStatic = false;
  });

  document.getElementById("exportBtn").addEventListener("click", doExport);

  document.getElementById("confirmCheck").addEventListener("change", function(){
    var chk = document.getElementById("confirmCheck");
    document.getElementById("confirmBtn").disabled = confirmed || !chk.checked || !reviewerName.trim();
  });
  document.getElementById("confirmBtn").addEventListener("click", function(){
    if(!reviewerName.trim() || !document.getElementById("confirmCheck").checked) return;
    confirmed = true;
    confirmedAt = new Date().toISOString();
    saveStore();
    updateConfirmUI();
    doExport();
  });

  applyStaticTexts();
  renderGroups();
  updateProgress();
  renderReport();
  updateConfirmUI();
  requestAnimationFrame(tick);
}

start();
})();
</script>
